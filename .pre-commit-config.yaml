# Diretórios vendorizados/gerados (.vllm, egg-info) ficam fora do escopo dos
# hooks — evita modificação colateral a cada run. Skills Cloudflare são
# symlinks para ~/.agents/skills (ver AGENTS.md → Topologia de Skills).
exclude: ^(\.vllm/|transferegov_api\.egg-info/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies:
          - types-requests
          - types-psycopg2
          - types-cachetools
          - types-PyYAML
          - pandas-stubs
